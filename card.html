<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yamakasi — Okapi World Média</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0A0A0A;display:flex;align-items:center;justify-content:center;padding:1.5rem}
body::before{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(ellipse,rgba(201,168,76,0.07) 0%,transparent 65%);pointer-events:none;z-index:0}
.card{width:432px;max-width:100%;background:#0F0F0F;border:0.5px solid #C9A84C44;border-radius:24px;overflow:hidden;position:relative;z-index:1;animation:fadeUp 0.8s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card-hero{position:relative;height:216px;overflow:hidden}
.hero-bg{width:100%;height:100%;object-fit:cover;object-position:center 18%;filter:grayscale(100%) brightness(0.38)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,15,15,0.1) 0%,rgba(15,15,15,0.94) 100%)}
.hero-top{position:absolute;top:14px;left:16px}
.owm-logo{height:57px;width:auto;filter:drop-shadow(0 0 8px rgba(255,255,255,0.35))}
.hero-tag{position:absolute;bottom:16px;left:19px;right:19px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;color:#C9A84C88;letter-spacing:0.06em}
.body{padding:1.5rem 1.8rem 1.8rem}
.id-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:1.3rem}
.av-wrap{flex-shrink:0;position:relative}
.av{width:74px;height:74px;border-radius:50%;object-fit:cover;object-position:center 8%;border:1.5px solid #C9A84C55;filter:grayscale(10%)}
.badge{position:absolute;bottom:-3px;right:-3px;width:25px;height:25px;background:#0A0A0A;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #C9A84C22}
.badge img{width:18px;height:18px}
.nblock{flex:1;display:flex;flex-direction:column;justify-content:center}
.fname{font-family:'Poppins',sans-serif;font-weight:700;font-size:26px;color:#C9A84C;line-height:1.0;letter-spacing:0.12em;margin-bottom:5px}
.ftitle{font-family:'Poppins',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.18em;color:#F5F0E855;text-transform:uppercase}
.divider{height:0.5px;background:linear-gradient(90deg,transparent,#C9A84C44,transparent);margin:0 0 1.1rem}
.cts{display:flex;flex-direction:column;gap:8px;margin-bottom:1.2rem}
.cr{display:flex;align-items:center;gap:11px}
.cl{font-family:'Poppins',sans-serif;font-size:9.5px;font-weight:400;letter-spacing:0.14em;color:#C9A84C;text-transform:uppercase;min-width:26px}
.cv{font-family:'Poppins',sans-serif;font-size:12px;font-weight:300;color:#F5F0E8AA}
.bottom{display:flex;align-items:center;gap:14px;border-top:0.5px solid #C9A84C1A;padding-top:1.1rem}
.qz{position:relative;width:74px;height:74px;flex-shrink:0}
.qc{position:absolute;width:11px;height:11px;border-color:#C9A84C;border-style:solid}
.qtl{top:0;left:0;border-width:1.5px 0 0 1.5px}
.qtr{top:0;right:0;border-width:1.5px 1.5px 0 0}
.qbl{bottom:0;left:0;border-width:0 0 1.5px 1.5px}
.qbr{bottom:0;right:0;border-width:0 1.5px 1.5px 0}
canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);image-rendering:pixelated}
.ql{font-family:'Poppins',sans-serif;font-size:8.5px;letter-spacing:0.1em;color:#F5F0E822;text-transform:uppercase;text-align:center;margin-top:4px}
.acts{display:flex;flex-direction:column;gap:6px;flex:1}
.btn{padding:10px 12px;font-family:'Poppins',sans-serif;font-size:10px;font-weight:400;letter-spacing:0.11em;text-transform:uppercase;border-radius:9px;cursor:pointer;transition:all 0.2s;border:none;text-align:center;width:100%}
.bg{background:#C9A84C;color:#0A0A0A}
.bg:active{background:#D4B866}
.bgh{background:transparent;color:#C9A84C;border:0.5px solid #C9A84C44}
.bgh:active{background:#C9A84C0D}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#1A1A1A;border:0.5px solid #C9A84C55;color:#C9A84C;font-family:'Poppins',sans-serif;font-size:10px;letter-spacing:0.1em;padding:9px 18px;border-radius:100px;text-transform:uppercase;transition:all 0.3s;opacity:0;pointer-events:none;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>

function gf_mul(a,b){if(!a||!b)return 0;let log=new Array(256),exp=new Array(512),x=1;for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x=(x<<1)^(x>=128?0x11d:0)}for(let i=255;i<512;i++)exp[i]=exp[i-255];return exp[log[a]+log[b]]}
function gf_poly_mul(p,q){let r=new Array(p.length+q.length-1).fill(0);for(let j=0;j<q.length;j++)for(let i=0;i<p.length;i++)r[i+j]^=gf_mul(p[i],q[j]);return r}
function gen_poly(n){let g=[1],exp=new Array(512),x=1;for(let i=0;i<255;i++){exp[i]=x;x=(x<<1)^(x>=128?0x11d:0)}for(let i=255;i<512;i++)exp[i]=exp[i-255];for(let i=0;i<n;i++)g=gf_poly_mul(g,[1,exp[i]]);return g}
function rs_encode(data,nsym){let gen=gen_poly(nsym),msg=[...data,...new Array(nsym).fill(0)];for(let i=0;i<data.length;i++){let c=msg[i];if(c)for(let j=0;j<gen.length;j++)msg[i+j]^=gf_mul(gen[j],c)}return msg.slice(data.length)}
function generateQR(url,canvas,fg,bg){
  const N=21,size=120,ctx=canvas.getContext('2d');
  let data=[],bits=[];for(let i=0;i<url.length;i++)data.push(url.charCodeAt(i));
  function addBits(v,n){for(let i=n-1;i>=0;i--)bits.push((v>>i)&1)}
  addBits(4,4);addBits(data.length,8);data.forEach(b=>addBits(b,8));addBits(0,4);
  while(bits.length%8)bits.push(0);
  let bytes2=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];bytes2.push(b)}
  const pads=[0xEC,0x11];let pi=0;while(bytes2.length<19){bytes2.push(pads[pi++%2])}
  const allBytes=[...bytes2,...rs_encode(bytes2,7)];
  let allBits=[];allBytes.forEach(b=>{for(let i=7;i>=0;i--)allBits.push((b>>i)&1)});
  let grid=Array.from({length:N},()=>new Array(N).fill(-1));
  let res=Array.from({length:N},()=>new Array(N).fill(false));
  function finder(r,c){for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){if(r+dr<0||r+dr>=N||c+dc<0||c+dc>=N)continue;let v=(dr===-1||dr===7||dc===-1||dc===7)?0:(dr===0||dr===6||dc===0||dc===6)?1:(dr>=2&&dr<=4&&dc>=2&&dc<=4)?1:0;grid[r+dr][c+dc]=v;res[r+dr][c+dc]=true}}
  finder(0,0);finder(0,N-7);finder(N-7,0);
  for(let i=0;i<N;i++){if(!res[6][i]){grid[6][i]=i%2?0:1;res[6][i]=true}if(!res[i][6]){grid[i][6]=i%2?0:1;res[i][6]=true}}
  grid[N-8][8]=1;res[N-8][8]=true;
  const fb=[1,1,1,0,1,1,1,1,1,0,0,0,1,0,0];
  [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]].forEach(([r,c],i)=>{grid[r][c]=fb[i];res[r][c]=true});
  [[N-1,8],[N-2,8],[N-3,8],[N-4,8],[N-5,8],[N-6,8],[N-7,8],[8,N-8],[8,N-7],[8,N-6],[8,N-5],[8,N-4],[8,N-3],[8,N-2],[8,N-1]].forEach(([r,c],i)=>{grid[r][c]=fb[i];res[r][c]=true});
  let bi=0,col=N-1;while(col>0){if(col===6)col--;for(let i=0;i<N;i++)for(let dc=0;dc<2;dc++){let c=col-dc,r=col%4<2?N-1-i:i;if(!res[r][c]){let bit=bi<allBits.length?allBits[bi++]:0;grid[r][c]=bit^((r+c)%2?0:1)}}col-=2}
  const cs=size/N;ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]===1){ctx.fillStyle=fg;ctx.fillRect(Math.round(c*cs),Math.round(r*cs),Math.ceil(cs),Math.ceil(cs))}
}
